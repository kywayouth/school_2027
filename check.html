<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운영자 상태 파일 검사</title><link rel="stylesheet" href="./styles.css"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"></head><body><main class="shell"><p class="eyebrow">운영자용 · 파일 저장 기능 없음</p><h1>상태 파일 검사</h1><p>수정하려는 status.txt 전체 내용을 붙여 넣어 검사하세요. 이 화면은 공개되어 있으니 개인정보는 입력하지 마세요. 내용은 서버에 전송하지 않습니다.</p><p><a href="./">선생님 화면으로 돌아가기</a></p><label for="status-input">상태 파일 내용</label><textarea id="status-input" rows="18" spellcheck="false"></textarea><p><button id="check">내용 검사</button> <button id="load">현재 게시된 파일 불러오기</button></p><section id="check-result" role="status" aria-live="polite"></section><p class="small-note">검사가 정상이더라도 실제 접수 여부는 시설에 확인하세요. 확인 후 GitHub status.txt에서 별도로 저장해야 합니다.</p></main><script type="module" src="./check.mjs"></script></body></html>
